name: Release vibe++

# A version bump on main releases it: the app on every platform, with the server built from
# this tree (the fork changes it), published as v<version> and marked latest, which is where the
# app's updater looks (desktop/src-tauri/src/updater/channel.rs). Update bundles are signed with
# the fork's updater key (secrets TAURI_PRIVATE_KEY and TAURI_KEY_PASSWORD); the apps themselves are not code-signed.

on:
    push:
        branches:
            - main
        paths:
            - "desktop/src-tauri/tauri.conf.json"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    prepare:
        runs-on: ubuntu-24.04
        outputs:
            version: ${{ steps.version.outputs.version }}
            release-id: ${{ steps.release.outputs.id }}
        steps:
            - uses: actions/checkout@v4

            - name: Read the version
              id: version
              run: echo "version=$(jq -r .version desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

            # A published release means this version already shipped (the file changed for another
            # reason); a draft is a failed earlier run and is reused.
            - name: Create the draft release
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: v${{ steps.version.outputs.version }}
              run: |
                  # Drafts can lose their tag name (GitHub shows them as untagged-…), so they are matched by name too.
                  existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\" or .name == \"vibe++ $TAG\") | [.id, .draft] | @tsv" | head -1)
                  if [ -n "$existing" ]; then
                      read -r id draft <<< "$existing"
                      if [ "$draft" != "true" ]; then
                          echo "$TAG is already released; nothing to do"
                          exit 0
                      fi
                      gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --silent
                  else
                      notes="What vibe++ adds on top of upstream: https://github.com/$GITHUB_REPOSITORY#about-vibe

                  The apps are not code-signed. On macOS, right-click the app and choose Open the first time."
                      generated=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body)
                      id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
                          -f name="vibe++ $TAG" -f body="$notes

                  $generated" -F draft=true --jq .id)
                  fi
                  echo "id=$id" >> "$GITHUB_OUTPUT"

    server:
        needs: prepare
        if: needs.prepare.outputs.release-id != ''
        strategy:
            fail-fast: false
            matrix:
                # The runners and flags of server-release.yml, so the build matches upstream's.
                include:
                    # macos-latest rather than server-release.yml's macos-15: the fork's runs waited
                    # on macos-15 until GitHub gave up, three times in a row.
                    - runner: macos-latest
                      triple: aarch64-apple-darwin
                    - runner: macos-15-intel
                      triple: x86_64-apple-darwin
                      cargo_flags: --no-default-features
                    - runner: ubuntu-24.04
                      triple: x86_64-unknown-linux-gnu
                    - runner: ubuntu-24.04-arm
                      triple: aarch64-unknown-linux-gnu
                    - runner: windows-latest
                      triple: x86_64-pc-windows-msvc
        runs-on: ${{ matrix.runner }}
        defaults:
            run:
                working-directory: server
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: server -> target
            - uses: getchore/setup-chore@v1
              with:
                  version: v1.6.0
            - name: Download prebuilt GGML libs
              run: chore fetch-libs
            - name: Build vibe-server
              shell: bash
              env:
                  VIBE_SERVER_COMMIT: ${{ github.sha }}
                  VIBE_SERVER_VERSION: ${{ needs.prepare.outputs.version }}
              run: cargo build -p vibe-server --release ${{ matrix.cargo_flags }}
            - uses: actions/upload-artifact@v4
              with:
                  name: vibe-server-${{ matrix.triple }}
                  path: server/target/release/vibe-server${{ runner.os == 'Windows' && '.exe' || '' }}
                  if-no-files-found: error

    app:
        needs: [prepare, server]
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                      triple: aarch64-apple-darwin
                    - platform: macos-latest
                      triple: x86_64-apple-darwin
                    - platform: ubuntu-22.04
                      triple: x86_64-unknown-linux-gnu
                    - platform: ubuntu-22.04-arm
                      triple: aarch64-unknown-linux-gnu
                    - platform: windows-latest
                      triple: x86_64-pc-windows-msvc
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  package_json_file: desktop/package.json

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: desktop/pnpm-lock.yaml

            - uses: astral-sh/setup-uv@v5

            - uses: getchore/setup-chore@v1
              with:
                  version: v1.6.0

            - uses: swatinem/rust-cache@v2

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install frontend dependencies
              run: pnpm install
              working-directory: ./desktop

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: chore linux-deps

            # ffmpeg (and the GStreamer plugin on Linux) come from the pinned upstream release;
            # the server it brings is replaced by this tree's build below.
            - name: Fetch the sidecars
              run: chore setup ${{ matrix.triple }}

            - uses: actions/download-artifact@v4
              with:
                  name: vibe-server-${{ matrix.triple }}
                  path: target/server-build

            - name: Use the server built from this tree
              shell: bash
              run: |
                  exe=""
                  if [ "$RUNNER_OS" = "Windows" ]; then exe=.exe; fi
                  mv -f "target/server-build/vibe-server$exe" "desktop/src-tauri/binaries/vibe-server-${{ matrix.triple }}$exe"
                  chmod 755 "desktop/src-tauri/binaries/vibe-server-${{ matrix.triple }}$exe"

            - name: Build and upload
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              with:
                  releaseId: ${{ needs.prepare.outputs.release-id }}
                  args: --target ${{ matrix.triple }}
                  projectPath: ./desktop
                  tauriScript: pnpm exec tauri

    publish:
        needs: [prepare, app]
        runs-on: ubuntu-24.04
        steps:
            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release edit "v${{ needs.prepare.outputs.version }}" -R "$GITHUB_REPOSITORY" --draft=false --latest
